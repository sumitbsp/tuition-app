<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden}
body{background:#fff;color:#111827;font-family:system-ui,-apple-system,sans-serif;position:relative}
.wrap{padding:32px 20px 0}
h1{font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.01em}
.sub{font-size:16px;color:#6B7280;margin-top:8px}
.f{margin-top:20px}
label{font-size:14px;font-weight:600;display:block;margin-bottom:6px}
.in{height:50px;border:1px solid #E5E7EB;border-radius:12px;padding:0 14px;display:flex;align-items:center;font-size:17px}
.in.ph{color:#9CA3AF}
.help{font-size:13px;color:#6B7280;margin-top:6px}
.row{display:flex;gap:8px;margin-bottom:8px}
.row .in{flex:1}
.x{width:50px;height:50px;border:1px solid #E5E7EB;border-radius:12px;display:grid;place-items:center;color:#6B7280}
.add{color:#2563EB;font-weight:600;height:44px;display:flex;align-items:center}
.dock{position:absolute;left:0;right:0;bottom:0;padding:12px 20px 28px;background:#fff}
.cta{height:54px;border-radius:12px;background:#2563EB;color:#fff;font-weight:600;font-size:17px;display:grid;place-items:center}
</style></head><body>
<div class="wrap">
  <h1>Welcome! Let's set up your tuition app.</h1>
  <p class="sub">It only takes a minute.</p>
  <div class="f"><label>Your name</label><div class="in">Ritu Sharma</div></div>
  <div class="f"><label>Phone number</label><div class="in">98765 43210</div></div>
  <div class="f"><label>UPI ID (optional)</label><div class="in ph">e.g. ritu@okaxis</div>
    <p class="help">You can add this later in Settings. It adds a payment link to reminders.</p></div>
  <div class="f"><label>Batches</label>
    <div class="row"><div class="in">Evening – Class 8</div><div class="x">✕</div></div>
    <div class="add">+ Add another batch</div></div>
</div>
<div class="dock"><div class="cta">Get started</div></div>
</body></html>
